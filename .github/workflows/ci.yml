name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install media tools
        run: brew list --versions ffmpeg >/dev/null || brew install ffmpeg
      - name: Install locked dependencies
        run: npm ci
      - name: Run source tests
        run: npm test
      - name: Build renderer, service and native helpers
        run: npm run build:all
