<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Creator Compiler recording preview</title><link rel="stylesheet" href="recording-hud.css"></head><body>
 <header><span class="drag-handle" aria-hidden="true">⠿</span><span class="status-dot"></span><strong id="status" role="status">Starting…</strong><span id="title"></span><button id="editor" aria-label="Return to editor" title="Return to editor"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h12v12M20 4 5 19M4 5v15h15"/></svg></button></header>
 <div class="recording-controls"><span id="clock">00:00</span><div id="microphone-meter" role="meter" aria-label="Microphone input level" aria-valuemin="0" aria-valuemax="100"><span id="microphone-bar"></span></div><button id="pause" aria-label="Pause recording">Pause</button><button id="stop" class="primary">Stop</button></div>
 <nav class="panel-controls" aria-label="Preview panels"><button id="camera-toggle" aria-expanded="false" title="Show or hide the preview; your camera keeps recording" aria-label="Show camera preview"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 6-3v10l-6-3"/></svg></button><button id="script-toggle" class="icon-button" aria-expanded="false" aria-label="Expand teleprompter" title="Expand teleprompter"><svg class="icon tray-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13v6h16v-6M12 4v10m-4-4 4 4 4-4"/></svg></button><span id="microphone-hint"></span></nav>
 <main class="island-content">
 <section id="camera" hidden><video id="camera-video" autoplay muted playsinline aria-label="Live camera preview" hidden></video><img id="camera-image" alt="Live camera preview" hidden><span id="camera-wait">Waiting for camera preview…</span></section>
 <div id="countdown" role="status" hidden><span id="countdown-number">3</span><span>Get ready</span></div>
 <section class="prompt" hidden><div class="prompt-heading"><span>Teleprompter</span><button id="reading-settings" aria-expanded="false" aria-label="Reading settings" title="Reading settings"><svg class="icon " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button></div><div id="script" role="document" aria-label="Recording script" tabindex="0"></div>
 <div id="reading-options" hidden><label class="auto-scroll-option"><span>Auto-scroll</span><input id="auto-scroll" type="checkbox" aria-label="Auto-scroll script"></label><label><span>Text size <output id="font-value" for="font-size">22</output></span><input id="font-size" type="range" min="14" max="42" step="1" value="22" aria-label="Script text size"></label><label><span>Scroll speed <output id="speed-value" for="speed">40</output></span><input id="speed" type="range" min="20" max="100" step="5" value="40" aria-label="Script scroll speed"><span class="speed-scale"><span>Slower</span><span>Faster</span></span></label></div></section>
 </main><p id="notice" role="status"></p>
 <script src="recording-hud.js"></script></body></html>
