<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src mediastream:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>SceneForge recording preview</title><link rel="stylesheet" href="recording-hud.css"></head><body>
 <header><span class="status-dot"></span><strong id="title">Recording</strong><button id="editor" aria-label="Show editor" title="Show editor">↗</button></header>
 <section id="camera" hidden><video id="camera-video" autoplay muted playsinline aria-label="Live camera preview" hidden></video><img id="camera-image" alt="Live camera preview" hidden><span id="camera-wait">Camera preview</span><span id="camera-label" class="source-pill camera-label"></span><div class="audio-labels"><span id="microphone-label" class="source-pill" hidden></span><span id="system-label" class="source-pill" hidden></span></div><button id="camera-toggle" aria-label="Collapse camera preview" title="Collapse camera preview">×</button></section>
 <div id="camera-collapsed" hidden><button id="camera-expand">Show camera preview</button></div>
 <footer><span id="clock">00:00</span><button id="stop" class="primary"><span aria-hidden="true">■</span> Stop</button><button id="pause" aria-label="Pause recording">Pause</button></footer>
 <div id="countdown" role="status" hidden><span id="countdown-number">3</span><span>Get ready</span></div>
 <section class="prompt"><div class="prompt-heading"><span>YOUR SCRIPT</span><button id="font-down" aria-label="Smaller script text">A−</button><button id="font-up" aria-label="Larger script text">A+</button></div><div id="script" role="document" aria-label="Recording script" tabindex="0"><p>Your script appears here.</p></div></section>
 <div class="reading"><button id="previous" aria-label="Previous paragraph" title="Previous paragraph">↑</button><button id="scroll-toggle" aria-label="Start script scrolling">Auto-scroll</button><button id="next" aria-label="Next paragraph" title="Next paragraph">↓</button><label>Speed <input id="speed" type="range" min="20" max="100" step="5" value="40" aria-label="Script scroll speed"></label></div><p id="notice" role="status"></p>
 <script src="recording-hud.js"></script></body></html>
